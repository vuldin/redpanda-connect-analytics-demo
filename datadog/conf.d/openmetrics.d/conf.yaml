# Datadog Agent generic OpenMetrics check config, for Redpanda Connect only.
#
# The Redpanda broker itself is scraped by the dedicated redpanda.d check
# instead (see datadog/conf.d/redpanda.d/conf.yaml + datadog/Dockerfile) -
# that's the official integration, whose metric names (e.g.
# redpanda.cluster.brokers) are what the "Redpanda Overview" out-of-the-box
# dashboard expects. There's no equivalent official check for Redpanda
# Connect, so RPCN's Prometheus-format /metrics endpoints are still scraped
# here directly - no Prometheus server needed in between.
#
# One instance per scrape target. This demo runs each Redpanda Connect
# pipeline as its own container ("standard" mode), so each one has its own
# /metrics endpoint and needs its own instance here. See the "Metrics and
# execution mode" section in the README for how this changes if you run the
# same pipelines in `streams` mode instead.
instances:
  - openmetrics_endpoint: http://connect-generator:4195/metrics
    namespace: rpcn
    metrics:
      - ".*"
    tags:
      - "rpcn_pipeline:generator"

  - openmetrics_endpoint: http://connect-processor:4195/metrics
    namespace: rpcn
    metrics:
      - ".*"
    tags:
      - "rpcn_pipeline:processor"

  - openmetrics_endpoint: http://connect-analytics:4195/metrics
    namespace: rpcn
    metrics:
      - ".*"
    tags:
      - "rpcn_pipeline:analytics"
